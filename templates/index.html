<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dark Sky</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#111111] text-gray-200 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-[#1c1c1e] border-b border-gray-800 py-3 px-6 flex justify-between items-center text-sm text-gray-400">
        <div class="flex items-center space-x-6">
            <span class="font-bold text-white tracking-wider flex items-center gap-1">
                ☁️ Dark Sky
            </span>
            <a href="#" class="hover:text-white">App</a>
            <a href="#" class="hover:text-white">Maps</a>
            <a href="#" class="hover:text-white">Developers</a>
            <a href="#" class="hover:text-white">Help</a>
            <a href="#" class="hover:text-white">About</a>
        </div>
        <div class="flex items-center space-x-4">
            <button id="geo-btn" title="Current Location" class="hover:text-white">📍 Use My Location</button>
            <span>˚F, mph</span>
            <span>English</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full px-4 py-8 flex-grow">
        <div class="flex justify-center mb-8">
            <div class="relative w-full max-w-lg">
                <input type="text" id="search-input" placeholder="Search location (e.g. New York, London)..." 
                    class="w-full bg-[#2c2c2e] text-white px-4 py-2 pr-10 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 text-center">
                <button id="search-btn" class="absolute right-3 top-2.5 text-gray-400 hover:text-white">🔍</button>
            </div>
        </div>

        <div id="weather-card" class="text-center space-y-6 hidden">
            <h1 id="location-title" class="text-2xl font-light text-gray-300">--</h1>
            
            <div id="metrics-bar" class="flex justify-center gap-6 text-xs text-gray-400 uppercase tracking-widest border-y border-gray-800 py-2">
                <span>Wind: <b id="wind-speed" class="text-gray-200">--</b></span>
                <span>Humidity: <b id="humidity" class="text-gray-200">--</b></span>
                <span>Pressure: <b id="pressure" class="text-gray-200">--</b></span>
            </div>

            <!-- Current Temp & Summary -->
            <div class="py-4">
                <div class="text-6xl font-extralight text-white mb-2" id="current-temp">--°</div>
                <div class="text-xl text-gray-300 capitalize" id="weather-desc">--</div>
            </div>

            <div class="mt-12 pt-8 border-t border-gray-800">
                <p class="text-sm text-gray-400 mb-4">Explore the weather in the past or future:</p>
                <div class="flex justify-center items-center gap-3">
                    <input type="date" id="time-machine-date" class="bg-[#2c2c2e] text-white px-3 py-1.5 rounded border border-gray-700 text-sm">
                    <button id="time-machine-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-1.5 rounded text-sm uppercase tracking-wider">
                        Time Machine
                    </button>
                </div>
            </div>
        </div>

        <div id="loader" class="text-center py-12 text-gray-500 hidden">Loading weather data...</div>
    </main>

    <footer class="text-center py-6 text-xs text-gray-600 border-t border-gray-900">
        <p>© Dark Sky Clone. For educational purposes.</p>
    </footer>

    <script>
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const geoBtn = document.getElementById('geo-btn');
        const loader = document.getElementById('loader');
        const weatherCard = document.getElementById('weather-card');
        const tmBtn = document.getElementById('time-machine-btn');
        const tmDate = document.getElementById('time-machine-date');

        let currentLat = null;
        let currentLon = null;

        async function fetchWeather(url) {
            loader.classList.remove('hidden');
            weatherCard.classList.add('hidden');
            try {
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === 'success') {
                    renderWeather(result.data);
                } else {
                    alert(result.message || 'Məlumat tapılmadı.');
                }
            } catch (err) {
                alert('Xəta baş verdi.');
            } finally {
                loader.classList.add('hidden');
            }
        }

        function renderWeather(data) {
            currentLat = data.lat;
            currentLon = data.lon;
            
            document.getElementById('location-title').innerText = data.location_name;
            
            const w = data.weather.current || data.weather;
            const main = w.main || {};
            const wind = w.wind || {};

            document.getElementById('current-temp').innerText = `${Math.round(main.temp || 0)}°`;
            document.getElementById('weather-desc').innerText = w.weather ? w.weather[0].description : '--';
            document.getElementById('wind-speed').innerText = `${wind.speed || 0} mph`;
            document.getElementById('humidity').innerText = `${main.humidity || 0}%`;
            document.getElementById('pressure').innerText = `${main.pressure || 0} mb`;

            weatherCard.classList.remove('hidden');
        }

        searchBtn.addEventListener('click', () => {
            const val = searchInput.value.trim();
            if (val) fetchWeather(`/api/weather?city=${encodeURIComponent(val)}`);
        });

        geoBtn.addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    fetchWeather(`/api/weather?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
                }, () => alert('Geolokasiya icazəsi verilmədi.'));
            }
        });

        tmBtn.addEventListener('click', () => {
            const selectedDate = tmDate.value;
            if (!selectedDate || !currentLat || !currentLon) {
                alert('Zəhmət olmasa tarix və məkan seçin.');
                return;
            }
            const timestamp = Math.floor(new Date(selectedDate).getTime() / 1000);
            fetchWeather(`/api/weather?lat=${currentLat}&lon=${currentLon}&dt=${timestamp}`);
        });
    </script>
</body>
</html>
